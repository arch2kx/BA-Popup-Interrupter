name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build if a build script exists
        id: build
        run: |
          if [ -f package.json ] && jq -e '.scripts.build' package.json > /dev/null; then
            npm ci
            npm run build
            if [ -d dist ]; then
              echo "dir=dist" >> "$GITHUB_OUTPUT"
            elif [ -d build ]; then
              echo "dir=build" >> "$GITHUB_OUTPUT"
            else
              echo "Build script ran but no dist/ or build/ folder was found"
              exit 1
            fi
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - name: Check manifest version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(jq -r .version "${{ steps.build.outputs.dir }}/manifest.json")
          if [ "$TAG" != "$VER" ]; then
            echo "Tag $TAG does not match manifest version $VER"
            exit 1
          fi

      - name: Package
        run: |
          ZIP="$GITHUB_WORKSPACE/bapi-${GITHUB_REF_NAME}.zip"
          cd "${{ steps.build.outputs.dir }}"
          zip -r "$ZIP" . -x ".git/*" ".github/*" "node_modules/*" "*.zip"

      - uses: softprops/action-gh-release@v2
        with:
          files: bapi-${{ github.ref_name }}.zip
          generate_release_notes: true
