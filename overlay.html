<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }

            body {
                width: 220px;
                height: 220px;
                overflow: hidden;
                background: transparent;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            img {
                width: 200px;
                height: 200px;
                object-fit: contain;
                opacity: 0;
                transition: opacity 0.3s ease;
            }

            img.visible {
                opacity: 1;
            }
        </style>
    </head>
    <body>
        <img id="character" src="">
        <script src="overlay.js"></script>
    </body>
</html>
