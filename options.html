<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Settings</title>
        <link rel="stylesheet" href="options.css">
    </head>
    <body>
        <h2>Settings</h2>

        <section class="section">
            <div class="row">
                <div class="row-label">Interval mode</div>
                <div class="row-control">
                    <label><input type="radio" name="intervalMode" value="fixed"> Fixed</label>
                    <label><input type="radio" name="intervalMode" value="random"> Random</label>
                </div>
            </div>

            <div class="row" id="fixed-interval">
                <div class="row-label"><label for="interval">Interval (ms)</label></div>
                <div class="row-control">
                    <input id="interval" type="Number" value="5000" min="1000">
                </div>
            </div>

            <div class="row" id="random-interval">
                <div class="row-label">Interval range (ms)</div>
                <div class="row-control field-row">
                    <label for="intervalMin">Min</label>
                    <input id="intervalMin" type="Number" value="3000" min="1000">
                    <label for="intervalMax">Max</label>
                    <input id="intervalMax" type="Number" value="15000" min="1000">
                </div>
            </div>
        </section>

        <section class="section">
            <div class="row">
                <div class="row-label"><label for="duration">Duration (ms)</label></div>
                <div class="row-control">
                    <input id="duration" type="Number" value="3000" min="500">
                </div>
            </div>

            <div class="row">
                <div class="row-label"><label for="popupSize">Popup size (in px., max 600)</label></div>
                <div class="row-control">
                    <input id="popupSize" type="Number" value="400" min="100" max="600">
                </div>
            </div>
        </section>

        <section class="section">
            <div class="row">
                <div class="row-label">Characters</div>
                <div class="row-control">
                    <label><input type="radio" name="charMode" value="shuffle"> Shuffled deck</label>
                    <label><input type="radio" name="charMode" value="weighted"> Weighted</label>
                    <label><input type="radio" name="charMode" value="single"> Single character</label>
                </div>
            </div>

            <div class="row">
                <div class="row-label"></div>
                <div class="row-control">
                    <ul id="character-list"></ul>
                </div>
            </div>
        </section>

        <section class="section">
            <div class="row">
                <div class="row-label"><label for="mute">Mute</label></div>
                <div class="row-control">
                    <input type="checkbox" id="mute">
                </div>
            </div>

            <div class="row">
                <div class="row-label"><label for="dndStart">Do not disturb</label></div>
                <div class="row-control field-row">
                    <input id="dndStart" type="time">
                    <span>to</span>
                    <input id="dndEnd" type="time">
                </div>
            </div>

            <div class="row">
                <div class="row-label">URL blacklist</div>
                <div class="row-control">
                    <textarea id="blacklist" rows="4" placeholder="https://example.com (one per line)"></textarea>
                </div>
            </div>
        </section>

        <div class="save-bar">
            <div class="save-bar-inner">
                <button id="save">Save</button>
            </div>
        </div>

        <script type="module" src="options.js"></script>
    </body>
</html>
