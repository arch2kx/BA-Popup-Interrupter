<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Settings</title>
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="options.css">
    </head>
    <body>
        <h2>Settings</h2>

        <section class="section">
            <div class="row">
                <div class="row-label">Interval mode</div>
                <div class="row-control">
                    <label><input type="radio" name="intervalMode" value="fixed"> Fixed</label>
                    <label><input type="radio" name="intervalMode" value="random"> Random</label>
                </div>
            </div>

            <div class="row" id="fixed-interval">
                <div class="row-label"><label for="interval">Interval (ms)</label></div>
                <div class="row-control">
                    <input id="interval" type="Number" value="5000" min="1000">
                </div>
            </div>

            <div class="row" id="random-interval">
                <div class="row-label">Interval range (ms)</div>
                <div class="row-control field-row">
                    <label for="intervalMin">Min</label>
                    <input id="intervalMin" type="Number" value="3000" min="1000">
                    <label for="intervalMax">Max</label>
                    <input id="intervalMax" type="Number" value="15000" min="1000">
                </div>
            </div>
        </section>

        <section class="section">
            <div class="row">
                <div class="row-label"><label for="duration">Duration (ms)</label></div>
                <div class="row-control">
                    <input id="duration" type="Number" value="3000" min="500">
                </div>
            </div>

            <div class="row">
                <div class="row-label"><label for="popupSize">Popup size (in px., max 600)</label></div>
                <div class="row-control">
                    <input id="popupSize" type="Number" value="400" min="100" max="600">
                </div>
            </div>
        </section>

        <section class="section">
            <div class="row">
                <div class="row-label">Characters</div>
                <div class="row-control">
                    <label><input type="radio" name="charMode" value="shuffle"> Shuffled deck</label>
                    <label><input type="radio" name="charMode" value="weighted"> Weighted</label>
                    <label><input type="radio" name="charMode" value="single"> Single character</label>
                </div>
            </div>

            <div class="row">
                <div class="row-label"></div>
                <div class="row-control">
                    <div class="character-picker">
                        <input id="character-search" type="search" placeholder="Search by name or academy" aria-label="Search characters">
                        <div id="character-list"></div>
                        <p id="character-empty" hidden>No characters match.</p>

                        <details class="add-character">
                            <summary>Add a custom student</summary>
                            <div class="add-character-fields">
                                <input id="custom-name" type="text" placeholder="Name" aria-label="Student name" maxlength="40">
                                <input id="custom-academy" type="text" placeholder="Academy (optional)" aria-label="Academy" maxlength="40">
                                <input id="custom-image" type="text" placeholder="Image URL" aria-label="Image URL">
                                <input id="custom-sound" type="text" placeholder="Audio URL" aria-label="Audio URL">
                                <details class="advanced">
                                    <summary>Advanced</summary>
                                    <div class="gain-control">
                                        <label for="custom-gain">Gain</label>
                                        <input id="custom-gain" type="Number" min="0" max="1" step="0.05" value="1">
                                        <span class="hint">Volume multiplier, 0 to 1. Lower it if this clip is louder than the built-in ones.</span>
                                    </div>
                                </details>
                                <div class="add-character-actions">
                                    <button id="custom-add" type="button">Add student</button>
                                    <span id="custom-status" role="status"></span>
                                </div>
                            </div>
                        </details>
                    </div>
                </div>
            </div>
        </section>

        <section class="section">
            <div class="row">
                <div class="row-label"><label for="mute">Mute</label></div>
                <div class="row-control">
                    <input type="checkbox" id="mute">
                </div>
            </div>

            <div class="row">
                <div class="row-label"><label for="volume">Volume</label></div>
                <div class="row-control">
                    <div class="slider">
                        <output id="volume-value" for="volume">100%</output>
                        <input id="volume" type="range" min="0" max="100" step="1" value="100">
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="row-label"><label for="dndStart">Do not disturb</label></div>
                <div class="row-control field-row">
                    <input id="dndStart" type="time">
                    <span>to</span>
                    <input id="dndEnd" type="time">
                </div>
            </div>

            <div class="row">
                <div class="row-label">URL blacklist</div>
                <div class="row-control">
                    <textarea id="blacklist" rows="4" placeholder="https://example.com (one per line)"></textarea>
                </div>
            </div>
        </section>

        <div class="save-bar">
            <div class="save-bar-inner">
                <button id="export" type="button" class="secondary-button">Export</button>
                <button id="import" type="button" class="secondary-button">Import</button>
                <input id="import-file" type="file" accept="application/json,.json" hidden>
                <button id="reset" type="button" class="secondary-button danger-button">Reset</button>
                <button id="save">Save</button>
            </div>
        </div>

        <script type="module" src="options.js"></script>
    </body>
</html>
